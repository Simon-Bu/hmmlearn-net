interface: |
  // src/HmmLearn/BaseHmm.cs: the method exists and is merged; no signature change.
  public double[] GetStationaryDistribution();   // throws InvalidOperationException when TransMat is null (unchanged)

  Semantics after the fix:
  - unique stationary distribution: unchanged;
  - not unique: the stationary distribution of the closed class with the lowest minimum state index (computed on that class alone, where it is
    unique), 0 elsewhere. The result is finite, non-negative, sums to 1 and is a fixed point: pi * TransMat = pi. TransMat is not modified.
  - Expected values of the non-unique matrices (oracle/golden/stationary.json, non_unique_cases, from hmmlearn 0.3.3):
    identity 3x3 -> [1, 0, 0]; two absorbing states and a transient state [[1,0,0],[0,1,0],[0.3,0.3,0.4]] -> [1, 0, 0];
    two disconnected 2-cycles -> [0.5, 0.5, 0, 0]; two ergodic blocks [[.9,.1,0,0],[.2,.8,0,0],[0,0,.5,.5],[0,0,.5,.5]] -> [2/3, 1/3, 0, 0].
  - The XML summary states the rule for the non-unique case (hmmlearn returns whichever eigenvector LAPACK finds first; the port is
    deterministic and agrees on the cases above).
  - Suggested method (the coder may use another correct one): keep the LU solve as the first attempt; when its result has a non-finite entry,
    find the closed classes by reachability on the graph TransMat[i, j] > 0, take the one with the lowest minimum index and solve the same
    normalized system restricted to that class.

  Tests (written by the coder FIRST, in tests/acceptance/HMM-26/, namespace HmmLearn.Tests.Acceptance.Hmm26), exactly this file and class
  (xunit 2 style attributes, `using Xunit` is global):
  - NonUniqueStationaryTests.cs  -> class NonUniqueStationaryTests
  Test support, already committed and read-only (tests/HmmLearn.Tests/Support/Golden.cs, namespace HmmLearn.Tests.Support): Golden.Load("stationary")
  returns the JsonElement of oracle/golden/stationary.json; GoldenJson extension methods on JsonElement: Items(), AsDouble(), AsVector(),
  AsMatrix(), AsString(), Has(name); a property is read with element.GetProperty("name"). Close.Equal(double expected, double actual, string what)
  and Close.Equal(Array expected, Array actual, string what) apply the oracle tolerance. The existing tests of HMM-9
  (tests/acceptance/HMM-9/StationaryAndCriteriaTests.cs, read-only) show how a model is built for this method: only TransMat is needed.
  Cover: every non_unique_cases entry (the oracle values, and the properties finite, non-negative, sum 1, fixed point), plus hand-written
  controls: the unique periodic matrix [[0,1],[1,0]] -> [0.5, 0.5], and that TransMat is left unchanged.
