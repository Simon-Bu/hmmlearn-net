# Ticket HMM-3. Schema: AnyMac/formats/schemas/ticket.schema.json
version: 1
id: HMM-3
title: Stats - log multivariate normal density for the four covariance types
repo: software-factory/hmmlearn-net
base: main
phase: J1
type: feature
level: standard
objective: |
  Port hmmlearn/stats.py to C#: HmmLearn.Stats.LogMultivariateNormalDensity, the Gaussian emission likelihood used by the Gaussian
  and mixture models later. Reference: reference/hmmlearn-0.3.3/src/hmmlearn/stats.py (98 lines) and the numbers of
  oracle/golden/stats.json (structure in oracle/README.md; do not open the JSON file whole). There is no Python test file for it.
scope:
  writable:
    - src/HmmLearn/Stats.cs
  read_only:
    - src/HmmLearn/CovarianceType.cs
    - src/HmmLearn/Utils.cs
    - src/HmmLearn/InternalUtils.cs
    - src/HmmLearn/HmmLearn.csproj
    - reference/**
