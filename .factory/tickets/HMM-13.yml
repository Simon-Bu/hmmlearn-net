interface: |
  // src/HmmLearn/GaussianEmission.cs and src/HmmLearn/GaussianHmm.cs (committed as stubs that throw NotImplementedException)
  namespace HmmLearn;
  public class GaussianStatistics : SufficientStatistics
  {
      public GaussianStatistics(int nComponents, int nFeatures, CovarianceType covarianceType);
      public double[] Post { get; set; }  public double[,] Obs { get; set; }  public double[,] Obs2 { get; set; }
      public double[,,]? ObsObsT { get; set; }                // only for Full and Tied
  }
  internal static class GaussianEmission
  {
      internal static IReadOnlyDictionary<char, int> NFitScalars(int nComponents, int nFeatures, CovarianceType covarianceType);
      internal static void Accumulate(GaussianStatistics stats, double[,] x, double[,] posteriors, CovarianceType covarianceType,
          bool needsMean, bool needsCovars);
      internal static double[] GenerateSample(double[,] means, double[,,] fullCovars, int state, Random random);
  }
  public partial class GaussianHmm : BaseHmm        // GaussianHmm.Learning.cs holds Init and DoMStep (read-only here)
  {
      public GaussianHmm(int nComponents = 1, CovarianceType covarianceType = CovarianceType.Diag, double minCovar = 1e-3,
          double startProbPrior = 1.0, double transMatPrior = 1.0, double meansPrior = 0, double meansWeight = 0,
          double covarsPrior = 1e-2, double covarsWeight = 1, DecoderAlgorithm algorithm = DecoderAlgorithm.Viterbi,
          int? randomState = null, int nIter = 10, double tol = 1e-2, bool verbose = false, string @params = "stmc",
          string initParams = "stmc", Implementation implementation = Implementation.Log);
      public CovarianceType CovarianceType { get; set; }  public double MinCovar { get; set; }
      public double MeansPrior { get; set; }  public double MeansWeight { get; set; }
      public double CovarsPrior { get; set; }  public double CovarsWeight { get; set; }
      public double[,]? Means { get; set; }
      public double[,,]? Covars { get; set; }                 // compact uniform shapes; the setter validates and copies
      public double[,,] FullCovars { get; }                   // (nc, nf, nf)
      protected override void Check();
      protected override double[,] ComputeLogLikelihood(double[,] x);
      protected override SufficientStatistics InitializeSufficientStatistics();
      protected override void AccumulateSufficientStatistics(SufficientStatistics stats, double[,] x, double[,] lattice,
          double[,] posteriors, double[,] fwdlattice, double[,] bwdlattice);
      protected virtual bool NeedsStatisticsForMeans { get; }
      protected virtual bool NeedsStatisticsForCovars { get; }
      protected override double[] GenerateSampleFromState(int state, Random random);
      protected override IReadOnlyDictionary<char, int>? GetNFitScalarsPerParam();
  }
  Already merged and usable: BaseHmm (Check, Init, DoMStep for start and transitions, Aic, Bic, GetStationaryDistribution), AbstractHmm
  (Fit, Score, ScoreSamples, Decode, Predict, PredictProba, Sample, NeedsInit, CheckSum1), Stats.LogMultivariateNormalDensity,
  InternalUtils.ValidateCovars, Utils.FillCovars, MathNet.Numerics (Cholesky, symmetric eigen decomposition). Base members that an
  override must call: base.Check(), base.AccumulateSufficientStatistics(...). The InternalsVisibleTo of the library makes the internal helper visible to the tests.

  Semantics: the XML comments of the stubs are the specification; follow hmm.py and _emissions.py. In particular
  - the compact covariance shapes: spherical (nc,1,1), diag (nc,1,nf), full (nc,nf,nf), tied (1,nf,nf); FullCovars always has shape
    (nc, nf, nf), correct for the spherical type too (hmmlearn's covars_ returns a wrong shape there when nf > 1: do NOT copy that);
  - Params gating of the statistics as in hmmlearn: the statistics of the means (Post and Obs) are accumulated when Params contains 'm';
    those of the covariances (Obs2, or ObsObsT for Full and Tied) when Params contains 'c' (so 'c' without 'm' leaves Post and Obs at 0);
  - sampling draws mean + L z with L a Cholesky factor of the full covariance of the state;
  - the number of fit scalars per letter is in the XML comment of GaussianEmission.NFitScalars.

  Acceptance tests (written by the tests agent): folder tests/acceptance/HMM-13/, namespace HmmLearn.Tests.Acceptance.Hmm13, exactly
  these files and classes (xunit 2 style attributes, `using Xunit` is global):
  - InferenceParityTests.cs  -> class InferenceParityTests  (oracle inference_cases of the four covariance types, both implementations)
  - ValidationTests.cs       -> class ValidationTests       (Covars setter, Check, FullCovars, shapes)
  - SamplingTests.cs         -> class SamplingTests         (Sample for the four covariance types)
  - StatisticsTests.cs       -> class StatisticsTests       (the GaussianStatistics given to DoMStep after an E-step, and GaussianEmission helpers)

  Test support, already committed and read-only (tests/HmmLearn.Tests/Support/Golden.cs, namespace HmmLearn.Tests.Support):
  - Golden.Load("gaussian_spherical") (and gaussian_diag, gaussian_tied, gaussian_full) return the JsonElement of the files.
  - extension methods of GoldenJson on JsonElement: Items(), AsDouble(), AsVector(), AsMatrix(), AsTensor3(), AsInts(), AsString(),
    AsBool(), Has(name); a property is read with element.GetProperty("name"). A covariance type is the lowercase string of the case:
    Enum.Parse<CovarianceType>(text, ignoreCase: true).
  - Close.Equal(double expected, double actual, string what) and Close.Equal(Array expected, Array actual, string what): the oracle
    tolerance (relative 1e-6, absolute 1e-12). States are compared with Assert.Equal on int[].
  Golden files: inference_cases {name, n_components, n_features, covariance_type, startprob, transmat, means, covars (compact uniform),
  X, lengths, expected {score, log_prob, posteriors, viterbi {log_prob, states}, map {log_prob, states}}}: build the model with
  InitParams = "" and set StartProb, TransMat, Means and Covars (copy them, the arrays are reused), then Score, ScoreSamples, Decode with both
  algorithms, Predict and PredictProba, with Implementation.Log and Implementation.Scaling. The fit_cases of these files belong to the next ticket.
  Statistics tests: a test subclass of GaussianHmm overrides DoMStep to keep the GaussianStatistics it receives, and Fit runs one
  iteration (NIter = 1, InitParams = "", Params with and without 'm' and 'c'); the expected sums are computed in the test with plain
  loops from the posteriors of PredictProba of the same model. Sampling tests use fixed seeds, large samples (thousands) and wide
  tolerances (at least 5 standard errors): the sample mean of each state near Means[state], and the sample covariance near FullCovars[state].
constraints:
  - "Only MathNet.Numerics (already referenced), the .NET base class library and the merged HmmLearn code: no new package."
  - "Only src/HmmLearn/GaussianHmm.cs and src/HmmLearn/GaussianEmission.cs change. Keep every signature above; every public, protected and internal member keeps an XML summary. No abstract member may be added."
  - "Do not mutate the arrays a caller passes in; the Covars setter and getter copy."
  - "The tests are deterministic: the numbers come from the oracle through Golden.Load, compared with Close.Equal; statistical tests use fixed seeds. Do not copy golden numbers by hand."
  - "Each test class compiles against the stubs and FAILS with NotImplementedException from them (never a compile error, never 'no test matches'): run each verify command before you finish."
  - "A case the criteria leave open is a minor ambiguity: choose the most reasonable reading, note it in an assumption and ask a non-blocking question."
  - "Run the verify commands exactly as written (dotnet run ...): they print each failing test with its message and stack. `dotnet test` cannot work in your sandbox (named pipes are blocked): do not spend time on it."
  - "Numbers come from the oracle, not from your head. Hand-written cases are for exceptions, shapes, null and in-place behaviour, invariants (a row sums to 1, a result is symmetric) and at most three exact numeric assertions on trivial inputs (zeros, ones, powers of two, an identity). Never assert exact equality to 0 or to -infinity for a result that rounding could change (a matrix that is only mathematically singular, a difference of nearly equal numbers). A wrong expectation in a locked test costs a whole round."
  - "An expected value that a test computes from a formula takes every operand from the test's own inputs by code (Math.Max(a, b), values.Sum(), a loop), never retyped by hand: the wrong one of two retyped numbers is the usual way a locked test turns out wrong (HMM-4: the maximum of (-1000, -999) written as -1000)."
  - "The report .factory/out/tests.json has exactly these fields and no other: version, ticket, role, round, status, summary, files, coverage (items: criterion C<n> and tests), assumptions (items: text and tests), questions (items: id Q<n>, question, blocking, and optionally context, options, recommendation, restates). An invented field (id, verify, description, recommended, test_disputes...) makes the validator refuse the report and costs a whole attempt."
  - "Keep your reasoning short: one reply that runs out of tokens (max-tokens) loses the whole attempt (HMM-6: 25 minutes of reasoning about the last digit of a formatted number, then nothing written). If a locked test still fails after two fixes and you cannot explain it, stop and write .factory/out/coder.json with status blocked and a question that gives the test, the expected and the actual value: the pilot answers. Never re-derive floating-point or library behaviour from bits: run a one-line experiment with the other API instead (F8 against a custom format string, Math.Round...). Custom numeric format strings round a 15-digit expansion, F8 and G17 are exact."
  - "In xunit, the string first argument of Assert.Throws<ArgumentException>(string, Action) is the expected ParamName, not a label: use Assert.Throws<T>(Action) (exact type) and put diagnostics elsewhere."
  - "A locked test that seems wrong is reported ONLY in test_disputes (exact test name, your argument, the fix you propose); never invent remark ids in replies, which answers the review remarks only (none in round 1)."
  - "Work inside this worktree only: do not read the factory or anything outside the repository."
criteria:
  - id: C1
    text: |
      Score, ScoreSamples, Decode (Viterbi and Map), Predict and PredictProba reproduce every inference case of the four oracle files
      (spherical, diag, tied, full covariances) with both implementations, several sequences and a length-1 sequence included.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm13.InferenceParityTests'
  - id: C2
    text: |
      The Covars setter rejects invalid compact covariances (wrong shape for the type, non-positive variances, a matrix that is not
      symmetric positive definite) with ArgumentException and stores a copy of a valid one; Check rejects missing or mis-shaped Means or
      Covars and a Covars whose number of features differs from that of Means; FullCovars gives (nc, nf, nf) matrices for the four types,
      correct for spherical covariances with several features.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm13.ValidationTests'
  - id: C3
    text: |
      Sample returns observations of the right shape whose per-state mean and covariance match Means and FullCovars (statistically), for
      the four covariance types, and the first state follows StartProb.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm13.SamplingTests'
  - id: C4
    text: |
      After an E-step the statistics given to DoMStep hold Post, Obs and Obs2 (spherical, diag) or ObsObsT (full, tied) equal to the
      weighted sums computed in the test from the posteriors, only for the letters in Params ('m' and 'c' as described), and
      GaussianEmission.NFitScalars gives the documented counts for the four types.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm13.StatisticsTests'
  - id: C5
    text: "The code stays readable: short methods, no dead code, the XML summaries match the behaviour."
