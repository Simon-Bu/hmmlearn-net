interface: |
  // src/HmmLearn/VariationalBaseHmm.cs (committed as stubs that throw NotImplementedException; the coder writes the bodies)
  namespace HmmLearn;
  public abstract class VariationalBaseHmm : AbstractHmm
  {
      protected VariationalBaseHmm(int nComponents, double? startProbPrior, double? transMatPrior, DecoderAlgorithm algorithm,
          int? randomState, int nIter, double tol, bool verbose, string @params, string initParams, Implementation implementation);
      public double? StartProbPrior { get; set; }            // scalar of the default prior (null: 1 / NComponents)
      public double? TransMatPrior { get; set; }
      public double[]? StartProbPriorValues { get; set; }    // hmmlearn's startprob_prior_
      public double[]? StartProbPosterior { get; set; }      // startprob_posterior_
      public double[,]? TransMatPriorValues { get; set; }    // transmat_prior_
      public double[,]? TransMatPosterior { get; set; }      // transmat_posterior_
      protected double[]? StartProbSubnorm { get; set; }     // startprob_subnorm_
      protected double[,]? TransMatSubnorm { get; set; }     // transmat_subnorm_
      protected abstract double[,] ComputeSubnormLogLikelihood(double[,] x);
      protected override void Init(double[,] x, int[] lengths);
      protected override void Check();
      protected override void EstepBegin();
      protected override double[] FitStartProb { get; }
      protected override double[,] FitTransMat { get; }
      protected override double[,] ComputeFitLogLikelihood(double[,] x);
      protected override double[,] ComputeFitLikelihood(double[,] x);
      protected override void DoMStep(SufficientStatistics stats);
      protected override double ComputeLowerBound(double currLogProb);
  }
  Already merged and usable: Fit and the E-step of AbstractHmm (they call the hooks above: EstepBegin, FitStartProb, FitTransMat,
  ComputeFitLogLikelihood, ComputeFitLikelihood, AccumulateSufficientStatistics, DoMStep, ComputeLowerBound), NeedsInit,
  CheckAndSetNFeatures, RaiseWarning, GetNFitScalarsPerParam (null by default; models override it), Params, InitParams, RandomState,
  NComponents, StartProb, TransMat, Score, Monitor; SufficientStatistics (NObs, Start, Trans); KlDivergence.KlDirichlet;
  MathNet.Numerics (SpecialFunctions.DiGamma, Dirichlet.Sample(Random, double[]) or gamma variates).

  Semantics: the XML comments of the stubs are the specification; follow base.py. In particular
  - the E-step uses the SUBNORMALIZED parameters: AccumulateSufficientStatistics of AbstractHmm already reads FitTransMat, so this class
    only has to provide the four Fit* hooks and EstepBegin; the lower bound is computed with the log probability of those passes;
  - Init: the posterior of the start probabilities is scaled by the number of sequences and the transition posterior by
    (sum of lengths) / NComponents, as in base.py; the Random is `new Random(RandomState.Value)` when RandomState has a value, else
    Random.Shared; the short-circuit `or` of base.py is preserved (the second NeedsInit is only evaluated when the first returned false);
  - DoMStep sets StartProb and TransMat from the normalized posteriors (that is how Score, Decode and Predict work after fitting);
  - the "t" statistics use the fitted xi sums only for sequences of at least two samples (already done by AbstractHmm).

  Acceptance tests (written by the tests agent): folder tests/acceptance/HMM-19/, namespace HmmLearn.Tests.Acceptance.Hmm19, exactly
  these files and classes (xunit 2, `using Xunit` is global):
  - CheckTests.cs               -> class CheckTests               (validation of the priors and posteriors)
  - FitParityTests.cs           -> class FitParityTests           (every fit case of oracle/golden/variational_base.json, both implementations)
  - InitTests.cs                -> class InitTests                (random initialization, InitParams, warnings)
  - SubnormAndBoundTests.cs     -> class SubnormAndBoundTests     (EstepBegin, DoMStep, ComputeLowerBound)
  The tests define their own small model `class StubVariationalHmm : VariationalBaseHmm` whose ComputeLogLikelihood and
  ComputeSubnormLogLikelihood both return a copy of x (the observations ARE the log frame probabilities, like the oracle's stub),
  GenerateSampleFromState returns new[] { (double)state }, GetNFitScalarsPerParam returns { 's' = nc - 1, 't' = nc * (nc - 1) }, and
  which exposes the protected members it needs through public wrappers (for instance `public void RunEstepBegin() => EstepBegin();`,
  `public double[]? Sub => StartProbSubnorm;`, `public double Bound(double lp) => ComputeLowerBound(lp);`,
  `public void RunMStep(SufficientStatistics s) => DoMStep(s);`); it passes its constructor arguments to VariationalBaseHmm.

  Test support, already committed and read-only (tests/HmmLearn.Tests/Support/Golden.cs, namespace HmmLearn.Tests.Support):
  - Golden.Load("variational_base") returns the JsonElement of oracle/golden/variational_base.json.
  - extension methods of GoldenJson on JsonElement: Items(), AsDouble(), AsVector(), AsMatrix(), AsInts(), AsString(), AsBool(),
    Has(name); a property is read with element.GetProperty("name").
  - Close.Equal(double expected, double actual, string what) and Close.Equal(Array expected, Array actual, string what): the oracle
    tolerance (relative 1e-6, absolute 1e-12).
  Golden file oracle/golden/variational_base.json fit_cases: each has name, constructor {n_components, params, n_iter, tol}, init
  {startprob_prior, startprob_posterior, transmat_prior, transmat_posterior} (the explicit starting parameters: build the model with
  InitParams = "" and set StartProbPriorValues, StartProbPosterior, TransMatPriorValues, TransMatPosterior), X (log frame
  probabilities), lengths and expected {startprob_posterior, transmat_posterior, startprob, transmat, history (Monitor.History),
  n_iter_done (Monitor.Iter), converged (Monitor.Converged), score (null when it is not available: params "t" alone leaves StartProb unset)}.
  Run every case with Implementation.Log and Implementation.Scaling; a null expected value means "do not compare".
  Initialization is tested statistically and structurally (no numbers): shapes, the start posterior sums to the number of sequences, every
  transition posterior row sums to (sum of lengths) / NComponents, prior values equal the scalar prior or 1 / NComponents, the same
  RandomState gives the same parameters, two seeds differ, InitParams = "" keeps explicit values, InitParams containing 's' on a model whose
  posterior is set raises the "will be overwritten" warning, and a degenerate size raises the warning.
  EstepBegin and the bound are tested with invariants and with values computed in the test with MathNet.Numerics.SpecialFunctions.DiGamma
  and KlDivergence.KlDirichlet (no hand-computed numbers): every subnormalized value is in (0, 1) and their sum is below 1, a row of
  the transition subnormalization equals exp(DiGamma(p[i]) - DiGamma(sum p)), the bound equals the log probability minus the KL terms.
constraints:
  - "Only MathNet.Numerics (already referenced), the .NET base class library and the merged HmmLearn code: no new package."
  - "Only src/HmmLearn/VariationalBaseHmm.cs changes. Keep every signature above; every public and protected member keeps an XML summary. No member may be added to AbstractHmm."
  - "Do not mutate the arrays a caller passes in; the posteriors, StartProb and TransMat are replaced by new arrays in the M-step and in Init."
  - "The tests are deterministic: the numbers come from the oracle through Golden.Load, compared with Close.Equal; initialization tests use fixed seeds and structural checks. Do not copy golden numbers by hand."
  - "Each test class compiles against the stubs and FAILS with NotImplementedException from them (never a compile error, never 'no test matches'): run each verify command before you finish."
  - "A case the criteria leave open is a minor ambiguity: choose the most reasonable reading, note it in an assumption and ask a non-blocking question."
  - "Run the verify commands exactly as written (dotnet run ...): they print each failing test with its message and stack. `dotnet test` cannot work in your sandbox (named pipes are blocked): do not spend time on it."
  - "Numbers come from the oracle, not from your head. Hand-written cases are for exceptions, shapes, null and in-place behaviour, invariants (a row sums to 1, a result is symmetric) and at most three exact numeric assertions on trivial inputs (zeros, ones, powers of two, an identity). Never assert exact equality to 0 or to -infinity for a result that rounding could change (a matrix that is only mathematically singular, a difference of nearly equal numbers). A wrong expectation in a locked test costs a whole round."
  - "An expected value that a test computes from a formula takes every operand from the test's own inputs by code (Math.Max(a, b), values.Sum(), a loop), never retyped by hand: the wrong one of two retyped numbers is the usual way a locked test turns out wrong (HMM-4: the maximum of (-1000, -999) written as -1000)."
  - "The report .factory/out/tests.json has exactly these fields and no other: version, ticket, role, round, status, summary, files, coverage (items: criterion C<n> and tests), assumptions (items: text and tests), questions (items: id Q<n>, question, blocking, and optionally context, options, recommendation, restates). An invented field (id, verify, description, recommended, test_disputes...) makes the validator refuse the report and costs a whole attempt."
  - "Keep your reasoning short: one reply that runs out of tokens (max-tokens) loses the whole attempt (HMM-6: 25 minutes of reasoning about the last digit of a formatted number, then nothing written). If a locked test still fails after two fixes and you cannot explain it, stop and write .factory/out/coder.json with status blocked and a question that gives the test, the expected and the actual value: the pilot answers. Never re-derive floating-point or library behaviour from bits: run a one-line experiment with the other API instead (F8 against a custom format string, Math.Round...). Custom numeric format strings round a 15-digit expansion, F8 and G17 are exact."
  - "Statistical assertions (recovery of parameters, agreement between covariance types, a fit that finds the true model) must hold for ANY correct implementation, hmmlearn included: start such a fit from explicit parameters near the truth (InitParams \"\") with wide tolerances, never from the random initialization, which can end in a poor local optimum or in a NaN row (HMM-17). From the random initialization assert only validity (shapes, rows summing to 1, finite values) and the monotone lower bound."
  - "In xunit, the string first argument of Assert.Throws<ArgumentException>(string, Action) is the expected ParamName, not a label: use Assert.Throws<T>(Action) (exact type) and put diagnostics elsewhere."
  - "A locked test that seems wrong is reported ONLY in test_disputes: each item has exactly two fields, test (the exact test name) and argument (your argument, with the fix you propose written inside it); any other field, such as fix, makes the validator refuse the whole report and costs an attempt (HMM-16). Never invent remark ids in replies, which answers the review remarks only (none in round 1)."
  - "Work inside this worktree only: do not read the factory or anything outside the repository."
criteria:
  - id: C1
    text: |
      Check accepts valid priors and posteriors and throws ArgumentException when one of the four arrays is null or has the wrong length
      or shape; Fit and Score on a model with invalid parameters fail the same way.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm19.CheckTests'
  - id: C2
    text: |
      Fit with explicit initial parameters reproduces startprob_posterior, transmat_posterior, startprob, transmat, history, n_iter_done,
      converged and score of every fit case of oracle/golden/variational_base.json with both implementations (the s, t and st parameter
      sets, strong priors, sequences of length 1, a few and many iterations).
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm19.FitParityTests'
  - id: C3
    text: |
      Init draws valid random Dirichlet posteriors with the documented scaling only for the parameters that must be initialized,
      reproducibly for a given RandomState, fills the priors from the scalar priors or 1 / NComponents, leaves explicit parameters alone
      when InitParams does not name them, and raises the two warnings (parameter set although InitParams names it; fewer data values
      than free parameters).
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm19.InitTests'
  - id: C4
    text: |
      EstepBegin computes the subnormalized start probabilities and transition rows with digamma (positive, below 1, summing to less
      than 1), DoMStep adds the statistics to the priors and normalizes the posteriors into StartProb and TransMat (only for the letters
      of Params), and ComputeLowerBound equals the log probability minus the KL divergences of the posteriors from the priors.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm19.SubnormAndBoundTests'
  - id: C5
    text: "The code stays readable: short methods, no dead code, the XML summaries match the behaviour."
