# Ticket HMM-7. Schema: AnyMac/formats/schemas/ticket.schema.json
version: 1
id: HMM-7
title: AbstractHmm inference - score, decode, predict and sample
repo: software-factory/hmmlearn-net
base: main
phase: J1
type: feature
level: critical
objective: |
  Port the inference half of _AbstractHMM of hmmlearn/base.py to C#: the abstract class HmmLearn.AbstractHmm with its parameters,
  the hooks that the models override (Check, ComputeLogLikelihood, ComputeLikelihood, GenerateSampleFromState) and Score,
  ScoreSamples, Decode, Predict, PredictProba and Sample. The fitting half (Fit, E-step, sufficient statistics) is another ticket
  (AbstractHmm.Fit.cs, same partial class); here nothing fits.
  Reference: reference/hmmlearn-0.3.3/src/hmmlearn/base.py lines 129-398 (the constructor, score_samples, score, _score, _score_log,
  _score_scaling, _decode_viterbi, _decode_map, decode, predict, predict_proba, sample) and 508-521 (_compute_posteriors_scaling and
  _compute_posteriors_log); its tests reference/hmmlearn-0.3.3/src/hmmlearn/tests/test_base.py (StubHMM, TestBaseAgainstWikipedia,
  TestBaseConsistentWithGMM); and the numbers of oracle/golden/base.json (structure in oracle/README.md; do not open the JSON file
  whole, it is large). Already merged and usable: Hmmc (forward, backward, Viterbi), Utils.Normalize and LogNormalize,
  InternalUtils.SplitXLengths, ConvergenceMonitor.
scope:
  writable:
    - src/HmmLearn/AbstractHmm.cs
  read_only:
    - src/HmmLearn/DecoderAlgorithm.cs
    - src/HmmLearn/Implementation.cs
    - src/HmmLearn/ConvergenceMonitor.cs
    - src/HmmLearn/Hmmc.ForwardBackward.cs
    - src/HmmLearn/Hmmc.ViterbiXi.cs
    - src/HmmLearn/Utils.cs
    - src/HmmLearn/InternalUtils.cs
    - src/HmmLearn/HmmLearn.csproj
    - reference/**
    - oracle/**
    - tests/HmmLearn.Tests/**
    - HmmLearn.sln
    - Directory.Build.props
    - PROGRAM.md
interface: |
  // src/HmmLearn/AbstractHmm.cs (committed as stubs that throw NotImplementedException; the coder writes the bodies)
  // src/HmmLearn/DecoderAlgorithm.cs: public enum DecoderAlgorithm { Viterbi, Map }   (read-only)
  // src/HmmLearn/Implementation.cs:   public enum Implementation { Log, Scaling }      (read-only)
  namespace HmmLearn;
  public abstract partial class AbstractHmm
  {
      protected AbstractHmm(int nComponents, DecoderAlgorithm algorithm, int? randomState, int nIter, double tol, bool verbose,
          string @params, string initParams, Implementation implementation);
      public int NComponents { get; set; }  public DecoderAlgorithm Algorithm { get; set; }  public int? RandomState { get; set; }
      public int NIter { get; set; }  public double Tol { get; set; }  public bool Verbose { get; set; }
      public string Params { get; set; }  public string InitParams { get; set; }  public Implementation Implementation { get; set; }
      public int? NFeatures { get; set; }  public double[]? StartProb { get; set; }  public double[,]? TransMat { get; set; }
      public ConvergenceMonitor Monitor { get; set; }       // new ConvergenceMonitor(tol, nIter, verbose) made by the constructor
      public event Action<string>? Warning;
      protected void RaiseWarning(string message);
      protected abstract void Check();
      protected abstract double[,] ComputeLogLikelihood(double[,] x);
      protected virtual double[,] ComputeLikelihood(double[,] x);           // default: exp of ComputeLogLikelihood, element by element
      protected abstract double[] GenerateSampleFromState(int state, Random random);
      protected static void CheckObservations(double[,] x);
      protected void CheckIsFitted();
      internal static double[,] ComputePosteriorsScaling(double[,] fwdlattice, double[,] bwdlattice);
      internal static double[,] ComputePosteriorsLog(double[,] fwdlattice, double[,] bwdlattice);
      public double Score(double[,] x, int[]? lengths = null);
      public (double LogProb, double[,] Posteriors) ScoreSamples(double[,] x, int[]? lengths = null);
      public (double LogProb, int[] States) Decode(double[,] x, int[]? lengths = null, DecoderAlgorithm? algorithm = null);
      public int[] Predict(double[,] x, int[]? lengths = null);
      public double[,] PredictProba(double[,] x, int[]? lengths = null);
      public (double[,] X, int[] States) Sample(int nSamples = 1, Random? random = null, int? currState = null);
  }
  Do NOT add abstract members (later tickets add only virtual ones: classes that derive from AbstractHmm in the acceptance tests
  of this ticket must keep compiling).

  Semantics: the XML comments of the stubs are the specification. In particular
  - Score, ScoreSamples, Decode, Predict, PredictProba first call CheckIsFitted() (InvalidOperationException when StartProb is null),
    then Check(), then CheckObservations(x) (ArgumentException for an empty matrix, zero columns, NaN or infinity); Sample calls
    CheckIsFitted() and Check();
  - lengths null means one sequence; otherwise InternalUtils.SplitXLengths splits it (ArgumentException when lengths do not sum
    to the number of rows). Each sequence is processed on its own; posteriors and states are concatenated;
  - Implementation.Log: Hmmc.ForwardLog on ComputeLogLikelihood, then BackwardLog for the posteriors; Implementation.Scaling:
    Hmmc.ForwardScaling on ComputeLikelihood, then BackwardScaling with the scaling factors; both give the same numbers;
  - Decode with the Map algorithm calls the same posterior computation as ScoreSamples on each sequence (the log probability it
    returns is the sum of the largest posterior of each sample, not a real log probability: hmmlearn does that);
  - Sample draws one uniform number per state and uses the first index whose cumulative probability is greater than it.

  Acceptance tests (written by the tests agent): folder tests/acceptance/HMM-7/, namespace HmmLearn.Tests.Acceptance.Hmm7, exactly
  these files and classes (xunit 2, `using Xunit` is global). The tests define their own small model, for instance
  `class StubHmm : AbstractHmm` whose ComputeLogLikelihood returns a copy of x (the observations ARE the log frame probabilities,
  n_features = n_components, exactly like the oracle's stub), Check does nothing and GenerateSampleFromState returns new[] { (double)state }:
  - ScoringTests.cs        -> class ScoringTests        (Score, ScoreSamples, PredictProba against oracle/golden/base.json, both implementations)
  - DecodingTests.cs       -> class DecodingTests       (Decode and Predict, Viterbi and Map, default algorithm)
  - SamplingTests.cs       -> class SamplingTests       (Sample)
  - ConstructionTests.cs   -> class ConstructionTests   (constructor, properties, Monitor, fitted and input checks)

  Test support, already committed and read-only (tests/HmmLearn.Tests/Support/Golden.cs, namespace HmmLearn.Tests.Support):
  - Golden.Load("base") returns the JsonElement of oracle/golden/base.json.
  - extension methods of GoldenJson on JsonElement: Items(), AsDouble(), AsVector(), AsMatrix(), AsInts(), AsString(), AsBool(),
    Has(name); a property is read with element.GetProperty("name").
  - Close.Equal(double expected, double actual, string what) and Close.Equal(Array expected, Array actual, string what): the oracle
    tolerance (relative 1e-6, absolute 1e-12). States are compared with Assert.Equal on int[].
  Golden file oracle/golden/base.json: inference_cases, each with name, n_components, startprob, transmat, X (the log frame
  probabilities, (n_samples, n_components)), lengths and expected {score, log_prob, posteriors, viterbi {log_prob, states},
  map {log_prob, states}}; (fit_cases belong to another ticket). Run every case with Implementation.Log AND Implementation.Scaling:
  the expected numbers are the same.
  Sampling is tested statistically with fixed seeds (new Random(12345)) and generous tolerances (at least 5 standard deviations or
  tens of thousands of samples), never against numbers: first-state frequency against StartProb, transition frequencies against
  TransMat, X[i,0] equal to States[i] for the stub, the first state equal to currState when given, continuation with
  currState = last state, and the same seed giving the same sample.
constraints:
  - "Only the .NET base class library and the merged HmmLearn code: no new package."
  - "Only src/HmmLearn/AbstractHmm.cs changes. Keep every public and protected signature above; every public and protected member keeps an XML summary. No abstract member may be added."
  - "Do not mutate the arrays a caller passes in (x, StartProb, TransMat, lengths); results are new arrays."
  - "The tests are deterministic: the numbers come from oracle/golden/base.json through Golden.Load, compared with Close.Equal; sampling tests use fixed seeds and wide tolerances. Do not copy golden numbers by hand."
  - "Each test class compiles against the stubs and FAILS with NotImplementedException from them (never a compile error, never 'no test matches'): run each verify command before you finish."
  - "A case the criteria leave open is a minor ambiguity: choose the most reasonable reading, note it in an assumption and ask a non-blocking question."
  - "Run the verify commands exactly as written (dotnet run ...): they print each failing test with its message and stack. `dotnet test` cannot work in your sandbox (named pipes are blocked): do not spend time on it."
  - "Numbers come from the oracle, not from your head. Hand-written cases are for exceptions, shapes, null and in-place behaviour, invariants (a row sums to 1, a result is symmetric) and at most three exact numeric assertions on trivial inputs (zeros, ones, powers of two, an identity). Never assert exact equality to 0 or to -infinity for a result that rounding could change (a matrix that is only mathematically singular, a difference of nearly equal numbers). A wrong expectation in a locked test costs a whole round."
  - "An expected value that a test computes from a formula takes every operand from the test's own inputs by code (Math.Max(a, b), values.Sum(), a loop), never retyped by hand: the wrong one of two retyped numbers is the usual way a locked test turns out wrong (HMM-4: the maximum of (-1000, -999) written as -1000)."
  - "The report .factory/out/tests.json has exactly these fields and no other: version, ticket, role, round, status, summary, files, coverage (items: criterion C<n> and tests), assumptions (items: text and tests), questions (items: id Q<n>, question, blocking, and optionally context, options, recommendation, restates). An invented field (id, verify, description, recommended, test_disputes...) makes the validator refuse the report and costs a whole attempt."
  - "Keep your reasoning short: one reply that runs out of tokens (max-tokens) loses the whole attempt (HMM-6: 25 minutes of reasoning about the last digit of a formatted number, then nothing written). If a locked test still fails after two fixes and you cannot explain it, stop and write .factory/out/coder.json with status blocked and a question that gives the test, the expected and the actual value: the pilot answers. Never re-derive floating-point or library behaviour from bits: run a one-line experiment with the other API instead (F8 against a custom format string, Math.Round...). Custom numeric format strings round a 15-digit expansion, F8 and G17 are exact."
  - "In xunit, the string first argument of Assert.Throws<ArgumentException>(string, Action) is the expected ParamName, not a label: use Assert.Throws<T>(Action) (exact type) and put diagnostics elsewhere."
  - "A locked test that seems wrong is reported ONLY in test_disputes (exact test name, your argument, the fix you propose); never invent remark ids in replies, which answers the review remarks only (none in round 1)."
  - "Work inside this worktree only: do not read the factory or anything outside the repository."
criteria:
  - id: C1
    text: |
      Score, ScoreSamples and PredictProba reproduce score, log_prob and posteriors of every inference case of oracle/golden/base.json
      with both implementations (several sequences through lengths included), and fail with InvalidOperationException when StartProb is
      null, ArgumentException for lengths that do not sum to the number of samples and for empty or non-finite observations.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm7.ScoringTests'
  - id: C2
    text: |
      Decode and Predict reproduce viterbi and map (log_prob and states) of every inference case with both implementations; Decode with
      no algorithm uses the Algorithm property; Predict equals the states of Decode.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm7.DecodingTests'
  - id: C3
    text: |
      Sample returns nSamples observations and states with the right shapes, draws states from StartProb and TransMat (frequencies
      within statistical tolerance), honours currState and the Random argument or RandomState seed (same seed, same sample), and throws
      ArgumentOutOfRangeException for nSamples below 1 or a currState out of range.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm7.SamplingTests'
  - id: C4
    text: |
      The constructor stores its arguments in the properties and creates Monitor with the same tolerance, iteration count and
      verbosity; RaiseWarning reaches the Warning subscribers; ComputeLikelihood defaults to the exponential of ComputeLogLikelihood;
      the internal helpers ComputePosteriorsScaling and ComputePosteriorsLog (used by the fit half later) give normalized posteriors
      that agree with each other on lattices of the same sequence.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm7.ConstructionTests'
  - id: C5
    text: "The code stays readable: short methods, no dead code, the XML summaries match the behaviour."
