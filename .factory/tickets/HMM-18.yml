# Ticket HMM-18. Schema: AnyMac/formats/schemas/ticket.schema.json
version: 1
id: HMM-18
title: KlDivergence - Dirichlet, normal, multivariate normal, gamma and Wishart
repo: software-factory/hmmlearn-net
base: main
phase: J4
type: feature
level: standard
objective: |
  Port hmmlearn/_kl_divergence.py to C#: the static class HmmLearn.KlDivergence with the five divergences that the lower bound of the
  variational models uses. Reference: reference/hmmlearn-0.3.3/src/hmmlearn/_kl_divergence.py (117 lines), its Python tests
  reference/hmmlearn-0.3.3/src/hmmlearn/tests/test_kl_divergence.py, and the numbers of oracle/golden/kl.json (structure in
  oracle/README.md).
scope:
  writable:
    - src/HmmLearn/KlDivergence.cs
  read_only:
    - src/HmmLearn/InternalUtils.cs
    - src/HmmLearn/HmmLearn.csproj
    - reference/**
    - oracle/**
    - tests/HmmLearn.Tests/**
    - HmmLearn.sln
    - Directory.Build.props
    - PROGRAM.md
interface: |
  // src/HmmLearn/KlDivergence.cs (committed as stubs that throw NotImplementedException; the coder writes the bodies)
  namespace HmmLearn;
  public static class KlDivergence
  {
      public static double KlDirichlet(double[] q, double[] p);
      public static double KlNormalDistribution(double meanQ, double varianceQ, double meanP, double varianceP);
      public static double KlMultivariateNormalDistribution(double[] meanQ, double[,] covarQ, double[] meanP, double[,] covarP);
      public static double KlGammaDistribution(double bQ, double cQ, double bP, double cP);
      public static double KlWishartDistribution(double dofQ, double[,] scaleQ, double dofP, double[,] scaleP);
  }
  Already merged and usable: InternalUtils.LogDet (log |det|, NaN for a negative determinant), MathNet.Numerics (SpecialFunctions.GammaLn,
  SpecialFunctions.DiGamma, Matrix inverse, trace).

  Semantics: the formulas are in the XML comments of the stubs and in the Python file; follow them exactly (the Wishart one uses
  logdet(scale / 2), not logdet(scale)). None of the methods asserts that the result is not negative. Inconsistent dimensions throw
  ArgumentException.

  Acceptance tests (written by the tests agent): folder tests/acceptance/HMM-18/, namespace HmmLearn.Tests.Acceptance.Hmm18, exactly
  these files and classes (xunit 2 style attributes, `using Xunit` is global):
  - DirichletTests.cs            -> class DirichletTests
  - UnivariateTests.cs           -> class UnivariateTests            (normal and gamma)
  - MultivariateNormalTests.cs   -> class MultivariateNormalTests
  - WishartTests.cs              -> class WishartTests

  Test support, already committed and read-only (tests/HmmLearn.Tests/Support/Golden.cs, namespace HmmLearn.Tests.Support):
  - Golden.Load("kl") returns the JsonElement of oracle/golden/kl.json.
  - extension methods of GoldenJson on JsonElement: Items(), AsDouble(), AsVector(), AsMatrix(), AsString(), Has(name); a property is read
    with element.GetProperty("name").
  - Close.Equal(double expected, double actual, string what) and Close.Equal(Array expected, Array actual, string what): the oracle
    tolerance (relative 1e-6, absolute 1e-12).
  Golden file oracle/golden/kl.json: dirichlet_cases {name, q, p, expected}, normal_cases {name, mean_q, variance_q, mean_p, variance_p,
  expected}, multivariate_normal_cases {name, mean_q, covar_q, mean_p, covar_p, expected}, gamma_cases {name, b_q, c_q, b_p, c_p,
  expected}, wishart_cases {name, dof_q, scale_q, dof_p, scale_p, expected}. Also test, with hand-written inputs, that KL(p, p) is 0 (within
  1e-9) and that KL(q, p) is positive for distinct arguments, and the ArgumentException for inconsistent dimensions.
constraints:
  - "Only MathNet.Numerics (already referenced), the .NET base class library and the merged HmmLearn code: no new package."
  - "Static, pure methods and no global state; only src/HmmLearn/KlDivergence.cs changes. Keep the public signatures above; every public member keeps an XML summary."
  - "The tests are deterministic: the numbers come from the oracle through Golden.Load, compared with Close.Equal. Do not copy golden numbers by hand."
  - "Each test class compiles against the stubs and FAILS with NotImplementedException from them (never a compile error, never 'no test matches'): run each verify command before you finish."
  - "A case the criteria leave open is a minor ambiguity: choose the most reasonable reading, note it in an assumption and ask a non-blocking question."
  - "Run the verify commands exactly as written (dotnet run ...): they print each failing test with its message and stack. `dotnet test` cannot work in your sandbox (named pipes are blocked): do not spend time on it."
  - "Numbers come from the oracle, not from your head. Hand-written cases are for exceptions, shapes, null and in-place behaviour, invariants (a row sums to 1, a result is symmetric) and at most three exact numeric assertions on trivial inputs (zeros, ones, powers of two, an identity). Never assert exact equality to 0 or to -infinity for a result that rounding could change (a matrix that is only mathematically singular, a difference of nearly equal numbers). A wrong expectation in a locked test costs a whole round."
  - "An expected value that a test computes from a formula takes every operand from the test's own inputs by code (Math.Max(a, b), values.Sum(), a loop), never retyped by hand: the wrong one of two retyped numbers is the usual way a locked test turns out wrong (HMM-4: the maximum of (-1000, -999) written as -1000)."
  - "The report .factory/out/tests.json has exactly these fields and no other: version, ticket, role, round, status, summary, files, coverage (items: criterion C<n> and tests), assumptions (items: text and tests), questions (items: id Q<n>, question, blocking, and optionally context, options, recommendation, restates). An invented field (id, verify, description, recommended, test_disputes...) makes the validator refuse the report and costs a whole attempt."
  - "Keep your reasoning short: one reply that runs out of tokens (max-tokens) loses the whole attempt (HMM-6: 25 minutes of reasoning about the last digit of a formatted number, then nothing written). If a locked test still fails after two fixes and you cannot explain it, stop and write .factory/out/coder.json with status blocked and a question that gives the test, the expected and the actual value: the pilot answers. Never re-derive floating-point or library behaviour from bits: run a one-line experiment with the other API instead (F8 against a custom format string, Math.Round...). Custom numeric format strings round a 15-digit expansion, F8 and G17 are exact."
  - "In xunit, the string first argument of Assert.Throws<ArgumentException>(string, Action) is the expected ParamName, not a label: use Assert.Throws<T>(Action) (exact type) and put diagnostics elsewhere."
  - "A locked test that seems wrong is reported ONLY in test_disputes: each item has exactly two fields, test (the exact test name) and argument (your argument, with the fix you propose written inside it); any other field, such as fix, makes the validator refuse the whole report and costs an attempt (HMM-16). Never invent remark ids in replies, which answers the review remarks only (none in round 1)."
  - "Work inside this worktree only: do not read the factory or anything outside the repository."
criteria:
  - id: C1
    text: |
      KlDirichlet reproduces every dirichlet case of oracle/golden/kl.json, is 0 for equal arguments and positive otherwise, and rejects
      vectors of different lengths with ArgumentException.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm18.DirichletTests'
  - id: C2
    text: |
      KlNormalDistribution and KlGammaDistribution reproduce every normal and gamma case of oracle/golden/kl.json and are 0 for equal
      arguments.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm18.UnivariateTests'
  - id: C3
    text: |
      KlMultivariateNormalDistribution reproduces every multivariate normal case (1, 2 and 3 dimensions) and agrees with the univariate
      formula in one dimension; inconsistent dimensions throw ArgumentException.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm18.MultivariateNormalTests'
  - id: C4
    text: |
      KlWishartDistribution reproduces every wishart case (1, 2 and 3 dimensions, including the example of hmmlearn's test) and is 0 for
      equal arguments within 1e-9.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm18.WishartTests'
  - id: C5
    text: "The code stays readable: short methods, no dead code, the XML summaries match the behaviour."
