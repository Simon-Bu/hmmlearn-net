# Ticket HMM-10. Schema: AnyMac/formats/schemas/ticket.schema.json
version: 1
id: HMM-10
title: CategoricalHmm - hidden Markov model with categorical emissions
repo: software-factory/hmmlearn-net
base: main
phase: J1
type: feature
level: standard
objective: |
  Port CategoricalHMM of hmmlearn/hmm.py and BaseCategoricalHMM of hmmlearn/_emissions.py to C#: HmmLearn.CategoricalHmm (derived from
  BaseHmm) and the shared helper HmmLearn.CategoricalEmission (internal, reused later by the variational categorical model). It is the
  first complete model: Fit, Score, ScoreSamples, Decode, Predict, PredictProba, Sample, Aic, Bic all work end to end.
  Reference: reference/hmmlearn-0.3.3/src/hmmlearn/hmm.py lines 26-155 (CategoricalHMM) and
  reference/hmmlearn-0.3.3/src/hmmlearn/_emissions.py lines 30-109 (BaseCategoricalHMM); its tests
  reference/hmmlearn-0.3.3/src/hmmlearn/tests/test_categorical_hmm.py; and the numbers of oracle/golden/categorical.json (structure in
  oracle/README.md; do not open the JSON file whole, it is large).
scope:
  writable:
    - src/HmmLearn/CategoricalHmm.cs
    - src/HmmLearn/CategoricalEmission.cs
  read_only:
    - src/HmmLearn/BaseHmm.cs
    - src/HmmLearn/AbstractHmm.cs
    - src/HmmLearn/AbstractHmm.Fit.cs
    - src/HmmLearn/SufficientStatistics.cs
    - src/HmmLearn/DecoderAlgorithm.cs
    - src/HmmLearn/Implementation.cs
    - src/HmmLearn/ConvergenceMonitor.cs
    - src/HmmLearn/Hmmc.ForwardBackward.cs
    - src/HmmLearn/Hmmc.ViterbiXi.cs
    - src/HmmLearn/Utils.cs
    - src/HmmLearn/InternalUtils.cs
    - src/HmmLearn/HmmLearn.csproj
    - reference/**
    - oracle/**
    - tests/HmmLearn.Tests/**
    - HmmLearn.sln
    - Directory.Build.props
    - PROGRAM.md
interface: |
  // src/HmmLearn/CategoricalEmission.cs and src/HmmLearn/CategoricalHmm.cs (committed as stubs that throw NotImplementedException)
  namespace HmmLearn;
  internal static class CategoricalEmission
  {
      internal static void CheckAndSetNFeatures(double[,] x, ref int? nFeatures);
      internal static double[,] Likelihood(double[,] emissionProb, double[,] x);
      internal static void AccumulateObs(double[,] obs, double[,] x, double[,] posteriors);
      internal static double[] GenerateSample(double[,] emissionProb, int state, Random random);
      internal static IReadOnlyDictionary<char, int> NFitScalars(int nComponents, int nFeatures);
  }
  public class CategoricalStatistics : SufficientStatistics
  {
      public CategoricalStatistics(int nComponents, int nFeatures);   // Obs = new double[nComponents, nFeatures]
      public double[,] Obs { get; set; }
  }
  public class CategoricalHmm : BaseHmm
  {
      public CategoricalHmm(int nComponents = 1, double startProbPrior = 1.0, double transMatPrior = 1.0, double emissionProbPrior = 1.0,
          int? nFeatures = null, DecoderAlgorithm algorithm = DecoderAlgorithm.Viterbi, int? randomState = null, int nIter = 10,
          double tol = 1e-2, bool verbose = false, string @params = "ste", string initParams = "ste",
          Implementation implementation = Implementation.Log);                    // sets EmissionProbPrior and NFeatures after the base constructor
      public double EmissionProbPrior { get; set; }
      public double[,]? EmissionProb { get; set; }
      protected override void Init(double[,] x, int[] lengths);
      protected override void Check();
      protected override void DoMStep(SufficientStatistics stats);
      protected override double[,] ComputeLikelihood(double[,] x);
      protected override double[,] ComputeLogLikelihood(double[,] x);
      protected override SufficientStatistics InitializeSufficientStatistics();
      protected override void AccumulateSufficientStatistics(SufficientStatistics stats, double[,] x, double[,] lattice,
          double[,] posteriors, double[,] fwdlattice, double[,] bwdlattice);
      protected override double[] GenerateSampleFromState(int state, Random random);
      protected override void CheckAndSetNFeatures(double[,] x);
      protected override IReadOnlyDictionary<char, int>? GetNFitScalarsPerParam();
  }
  Already merged and usable: BaseHmm (priors, Init, Check, DoMStep for start and transitions, Aic, Bic, GetStationaryDistribution),
  AbstractHmm (Fit, Score, ScoreSamples, Decode, Predict, PredictProba, Sample, NeedsInit, CheckSum1, RaiseWarning), Utils.Normalize.
  Base members that an override must call: base.Init(x, lengths), base.Check(), base.DoMStep(stats),
  base.AccumulateSufficientStatistics(...). The InternalsVisibleTo of the library makes the internal helper visible to the tests.

  Semantics: the XML comments of the stubs are the specification; follow hmm.py and _emissions.py. In particular
  - observations: exactly one column of integer-valued, non-negative numbers (ArgumentException otherwise: more than one column,
    a fractional or negative value, or a symbol above NFeatures - 1 when NFeatures is given); without NFeatures, it becomes the largest
    symbol plus 1 at the first Fit;
  - the M-step: EmissionProb = max(EmissionProbPrior - 1 + Obs, 0) row-normalized, like the start and transition updates of BaseHmm;
  - the likelihood of a sample under a state is EmissionProb[state, symbol]; its log is Math.Log of it.

  Acceptance tests (written by the tests agent): folder tests/acceptance/HMM-10/, namespace HmmLearn.Tests.Acceptance.Hmm10, exactly
  these files and classes (xunit 2, `using Xunit` is global):
  - InferenceParityTests.cs  -> class InferenceParityTests  (oracle inference_cases, both implementations)
  - FitParityTests.cs        -> class FitParityTests        (oracle fit_cases, both implementations)
  - ValidationTests.cs       -> class ValidationTests       (Check, symbols, NFeatures, shapes)
  - SamplingAndFitTests.cs   -> class SamplingAndFitTests   (Sample, random initialization, likelihood never decreasing during EM)

  Test support, already committed and read-only (tests/HmmLearn.Tests/Support/Golden.cs, namespace HmmLearn.Tests.Support):
  - Golden.Load("categorical") returns the JsonElement of oracle/golden/categorical.json.
  - extension methods of GoldenJson on JsonElement: Items(), AsDouble(), AsVector(), AsMatrix(), AsInts(), AsIntMatrix(), AsString(),
    AsBool(), Has(name); a property is read with element.GetProperty("name"). X is a (n, 1) matrix of symbols: use AsMatrix().
  - Close.Equal(double expected, double actual, string what) and Close.Equal(Array expected, Array actual, string what): the oracle
    tolerance (relative 1e-6, absolute 1e-12). States are compared with Assert.Equal on int[].
  Golden file oracle/golden/categorical.json: inference_cases {name, n_components, n_features, startprob, transmat, emissionprob, X,
  lengths, expected {score, log_prob, posteriors, viterbi {log_prob, states}, map {log_prob, states}}} (build the model with
  InitParams = "" and set the three arrays, then Score, ScoreSamples, Decode with both algorithms, Predict, PredictProba) and fit_cases
  {name, constructor {n_components, n_features, n_iter, tol, params, optionally startprob_prior, transmat_prior, emissionprob_prior},
  init {startprob, transmat, emissionprob}, X, lengths, expected {startprob, transmat, emissionprob, n_features, history, n_iter_done,
  converged, score, aic, bic}} (build the model with InitParams = "", set the three arrays, Fit, compare everything).
  Run every case with Implementation.Log and Implementation.Scaling. Statistical tests use fixed seeds (new Random(12345) or
  RandomState = 12345), large samples and wide tolerances (at least 5 standard deviations); during EM, the log likelihood after each
  single-iteration Fit must never decrease by more than 1e-9 relative (set NIter = 1 and InitParams = "" after the first Fit).
constraints:
  - "Only the .NET base class library and the merged HmmLearn code: no new package."
  - "Only src/HmmLearn/CategoricalHmm.cs and src/HmmLearn/CategoricalEmission.cs change. Keep every signature above; every public, protected and internal member keeps an XML summary."
  - "Do not mutate the arrays a caller passes in; EmissionProb is replaced by a new array in the M-step and in Init."
  - "The tests are deterministic: the numbers come from the oracle through Golden.Load, compared with Close.Equal; statistical tests use fixed seeds. Do not copy golden numbers by hand."
  - "Each test class compiles against the stubs and FAILS with NotImplementedException from them (never a compile error, never 'no test matches'): run each verify command before you finish."
  - "A case the criteria leave open is a minor ambiguity: choose the most reasonable reading, note it in an assumption and ask a non-blocking question."
  - "Run the verify commands exactly as written (dotnet run ...): they print each failing test with its message and stack. `dotnet test` cannot work in your sandbox (named pipes are blocked): do not spend time on it."
  - "Numbers come from the oracle, not from your head. Hand-written cases are for exceptions, shapes, null and in-place behaviour, invariants (a row sums to 1, a result is symmetric) and at most three exact numeric assertions on trivial inputs (zeros, ones, powers of two, an identity). Never assert exact equality to 0 or to -infinity for a result that rounding could change (a matrix that is only mathematically singular, a difference of nearly equal numbers). A wrong expectation in a locked test costs a whole round."
  - "An expected value that a test computes from a formula takes every operand from the test's own inputs by code (Math.Max(a, b), values.Sum(), a loop), never retyped by hand: the wrong one of two retyped numbers is the usual way a locked test turns out wrong (HMM-4: the maximum of (-1000, -999) written as -1000)."
  - "The report .factory/out/tests.json has exactly these fields and no other: version, ticket, role, round, status, summary, files, coverage (items: criterion C<n> and tests), assumptions (items: text and tests), questions (items: id Q<n>, question, blocking, and optionally context, options, recommendation, restates). An invented field (id, verify, description, recommended, test_disputes...) makes the validator refuse the report and costs a whole attempt."
  - "Keep your reasoning short: one reply that runs out of tokens (max-tokens) loses the whole attempt (HMM-6: 25 minutes of reasoning about the last digit of a formatted number, then nothing written). If a locked test still fails after two fixes and you cannot explain it, stop and write .factory/out/coder.json with status blocked and a question that gives the test, the expected and the actual value: the pilot answers. Never re-derive floating-point or library behaviour from bits: run a one-line experiment with the other API instead (F8 against a custom format string, Math.Round...). Custom numeric format strings round a 15-digit expansion, F8 and G17 are exact."
  - "In xunit, the string first argument of Assert.Throws<ArgumentException>(string, Action) is the expected ParamName, not a label: use Assert.Throws<T>(Action) (exact type) and put diagnostics elsewhere."
  - "A locked test that seems wrong is reported ONLY in test_disputes (exact test name, your argument, the fix you propose); never invent remark ids in replies, which answers the review remarks only (none in round 1)."
  - "Work inside this worktree only: do not read the factory or anything outside the repository."
criteria:
  - id: C1
    text: |
      Score, ScoreSamples, Decode (Viterbi and Map), Predict and PredictProba reproduce every inference case of
      oracle/golden/categorical.json with both implementations (including the Wikipedia rainy and sunny example, several sequences
      and a model with zeros).
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm10.InferenceParityTests'
  - id: C2
    text: |
      Fit reproduces the parameters, the history, the iteration count, the convergence flag, the score, aic and bic of every fit case of
      oracle/golden/categorical.json with both implementations (priors above and below 1, parameter subsets, a left-to-right model that
      keeps its zeros, sequences of length 1, an explicit n_features larger than the largest symbol).
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm10.FitParityTests'
  - id: C3
    text: |
      Invalid input and parameters are rejected with ArgumentException: an EmissionProb that is null, of the wrong shape or with rows
      that do not sum to 1; observations with a fractional or negative value, with a symbol above NFeatures - 1, or with more than one
      column; the number of features is inferred (largest symbol plus 1) or respected when given.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm10.ValidationTests'
  - id: C4
    text: |
      Sample returns symbols in 0..NFeatures-1 whose frequencies match EmissionProb (statistically, all symbols appear); with random
      initialization (InitParams "ste", fixed RandomState) Fit starts from valid distributions, is reproducible, and the log likelihood
      never decreases from one single-iteration Fit to the next on sampled data.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm10.SamplingAndFitTests'
  - id: C5
    text: "The code stays readable: short methods, no dead code, the XML summaries match the behaviour."
verifications:
