# Ticket HMM-25. Schema: AnyMac/formats/schemas/ticket.schema.json
version: 1
id: HMM-25
title: Hmmc - ComputeLogXiSum on a sequence without samples
repo: software-factory/hmmlearn-net
base: main
phase: J5
type: bug
level: standard
objective: |
  Fix the inconsistency that the review of HMM-5 left open (follow-up issue #14) in src/HmmLearn/Hmmc.ViterbiXi.cs, which is merged. For
  consistently empty input (fwdlattice, bwdlattice and the frame probabilities all (0, nc), transmat (nc, nc), i.e. n_samples = 0):
  - ComputeScalingXiSum already runs its documented empty loop and returns the neutral matrix of zeros;
  - ComputeLogXiSum reads fwdlattice[n_samples - 1, 0], that is row -1, and throws an undocumented IndexOutOfRangeException.
  The C++ reference has undefined behavior at that spot. The documented sum runs over t = 0..n_samples-2, which is empty for 0 samples as
  it is for 1 sample, so ComputeLogXiSum returns its neutral matrix too: an (nc, nc) matrix of -infinity, exactly what it returns for one
  sample. The coder writes the tests of this ticket and then the fix (no separate tests agent).
scope:
  writable:
    - src/HmmLearn/Hmmc.ViterbiXi.cs
    - tests/acceptance/HMM-25/**
  read_only:
    - src/HmmLearn/Hmmc.ForwardBackward.cs
    - src/HmmLearn/HmmLearn.csproj
    - reference/**
    - oracle/**
    - tests/HmmLearn.Tests/**
    - tests/acceptance/HMM-5/**
    - HmmLearn.sln
    - Directory.Build.props
    - PROGRAM.md
interface: |
  // src/HmmLearn/Hmmc.ViterbiXi.cs: both methods exist and are merged; no signature change.
  public static double[,] ComputeScalingXiSum(double[,] fwdlattice, double[,] transmat, double[,] bwdlattice, double[,] frameprob);
  public static double[,] ComputeLogXiSum(double[,] fwdlattice, double[,] transmat, double[,] bwdlattice, double[,] logFrameprob);

  Semantics after the fix:
  - n_samples = 0 (all of fwdlattice, bwdlattice and the frame probabilities are (0, nc), transmat is (nc, nc)): ComputeLogXiSum returns a new
    (nc, nc) matrix whose every entry is -infinity, without reading the last row of fwdlattice; ComputeScalingXiSum returns an (nc, nc)
    matrix of zeros (unchanged).
  - Shape errors keep throwing ArgumentException "shape mismatch" (for instance fwdlattice (0, 3) with frame probabilities (0, 2), or
    fwdlattice (1, 2) with frame probabilities (0, 2)); 0 samples is not a shape error by itself.
  - Every other behavior is unchanged (one sample and more). The XML summary of ComputeLogXiSum states the 0-sample result.

  Tests (written by the coder FIRST, in tests/acceptance/HMM-25/, namespace HmmLearn.Tests.Acceptance.Hmm25), exactly this file and class
  (xunit 2 style attributes, `using Xunit` is global):
  - ZeroSampleXiSumTests.cs  -> class ZeroSampleXiSumTests
  Read src/HmmLearn/Hmmc.ViterbiXi.cs and the tests of HMM-5 first (tests/acceptance/HMM-5/, read-only). Hand-written cases are enough, no
  golden file is needed. Use nc = 1, 2 and 3. Asserting -infinity exactly is right here: it is the documented neutral element, not the
  result of a computation that rounding could change.
