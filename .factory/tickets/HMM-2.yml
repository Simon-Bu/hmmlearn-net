# Ticket HMM-2. Schema: AnyMac/formats/schemas/ticket.schema.json
version: 1
id: HMM-2
title: InternalUtils - log-determinant, split by lengths, covariance checks
repo: software-factory/hmmlearn-net
base: main
phase: J1
type: feature
level: standard
objective: |
  Port hmmlearn/_utils.py to C#: the static class HmmLearn.InternalUtils with LogDet, SplitXLengths, ValidateCovars and
  DistributeCovarMatrixToMatchCovarianceType, used by the models and the KL divergences later.
  Reference: reference/hmmlearn-0.3.3/src/hmmlearn/_utils.py (84 lines) and the numbers of oracle/golden/internal_utils.json (structure in
  oracle/README.md; do not open the JSON file whole, it is large). There is no Python test file for these helpers.
scope:
  writable:
    - src/HmmLearn/InternalUtils.cs
  read_only:
    - src/HmmLearn/CovarianceType.cs
    - src/HmmLearn/Utils.cs
    - src/HmmLearn/HmmLearn.csproj
    - reference/**
    - oracle/**
