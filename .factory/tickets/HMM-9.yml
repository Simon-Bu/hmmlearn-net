interface: |
  // src/HmmLearn/BaseHmm.cs (committed as stubs that throw NotImplementedException; the coder writes the bodies)
  namespace HmmLearn;
  public abstract class BaseHmm : AbstractHmm
  {
      protected BaseHmm(int nComponents, double startProbPrior, double transMatPrior, DecoderAlgorithm algorithm, int? randomState,
          int nIter, double tol, bool verbose, string @params, string initParams, Implementation implementation);   // calls the AbstractHmm constructor
      public double StartProbPrior { get; set; }
      public double TransMatPrior { get; set; }
      protected override void Init(double[,] x, int[] lengths);
      protected override void Check();
      protected override void DoMStep(SufficientStatistics stats);
      protected override double ComputeLowerBound(double currLogProb);
      public double[] GetStationaryDistribution();
      public double Aic(double[,] x, int[]? lengths = null);
      public double Bic(double[,] x, int[]? lengths = null);
  }
  Already merged and usable from AbstractHmm: Fit and the E-step (AbstractHmm.Fit.cs), NeedsInit, CheckAndSetNFeatures, CheckSum1,
  RaiseWarning, GetNFitScalarsPerParam (null by default; models override it), Params, InitParams, RandomState, NComponents, StartProb,
  TransMat, Score; Utils.Normalize; SufficientStatistics (NObs, Start, Trans).

  Semantics: the XML comments of the stubs are the specification; follow base.py. In particular
  - Init draws the start probabilities and each transition row from a Dirichlet distribution with every parameter equal to
    1 / NComponents (MathNet.Numerics has Dirichlet.Sample(Random, double[]), or sample gamma variates), only for the parameters
    that NeedsInit; the Random is `new Random(RandomState.Value)` when RandomState has a value, else Random.Shared;
  - DoMStep: a prior below 1 can make "prior - 1 + statistics" negative: it is clipped to 0 first; an entry that is exactly 0 in the
    current StartProb (or TransMat) stays 0 whatever the statistics (left-to-right models); then normalization to sum 1;
  - Aic and Bic add up ALL the values of GetNFitScalarsPerParam(), not only the letters of Params.

  Acceptance tests (written by the tests agent): folder tests/acceptance/HMM-9/, namespace HmmLearn.Tests.Acceptance.Hmm9, exactly
  these files and classes (xunit 2, `using Xunit` is global). The tests define their own small model
  `class StubBaseHmm : BaseHmm` whose ComputeLogLikelihood returns a copy of x (the observations ARE the log frame probabilities,
  like the oracle's stub), GenerateSampleFromState returns new[] { (double)state }, and GetNFitScalarsPerParam returns
  { 's' = nc - 1, 't' = nc * (nc - 1) }; it passes its constructor arguments to BaseHmm:
  - CheckTests.cs                  -> class CheckTests                  (validation of StartProb and TransMat)
  - FitParityTests.cs              -> class FitParityTests              (every fit case of oracle/golden/base.json, both implementations)
  - InitTests.cs                   -> class InitTests                   (random initialization, InitParams, warnings)
  - StationaryAndCriteriaTests.cs  -> class StationaryAndCriteriaTests  (GetStationaryDistribution, Aic, Bic)

  Test support, already committed and read-only (tests/HmmLearn.Tests/Support/Golden.cs, namespace HmmLearn.Tests.Support):
  - Golden.Load("base") and Golden.Load("stationary") return the JsonElement of the files.
  - extension methods of GoldenJson on JsonElement: Items(), AsDouble(), AsVector(), AsMatrix(), AsInts(), AsString(), AsBool(),
    Has(name); a property is read with element.GetProperty("name").
  - Close.Equal(double expected, double actual, string what) and Close.Equal(Array expected, Array actual, string what): the oracle
    tolerance (relative 1e-6, absolute 1e-12).
  Golden file oracle/golden/base.json fit_cases: each has name, constructor {n_components, n_iter, tol, params, and sometimes
  startprob_prior and transmat_prior (otherwise 1.0)}, init {startprob, transmat} (the explicit starting parameters: build the model
  with InitParams = "" and set StartProb and TransMat), X (log frame probabilities), lengths and expected {startprob, transmat,
  history (Monitor.History), n_iter_done (Monitor.Iter), converged (Monitor.Converged), score, aic, bic}. Run every case with
  Implementation.Log and Implementation.Scaling. Oracle/golden/stationary.json: cases {name, transmat, expected}.
  Initialization is tested statistically and structurally (no numbers): rows sum to 1, entries in [0, 1], the same RandomState gives
  the same parameters, two seeds differ, InitParams = "" keeps explicit values, InitParams containing 's' on a model whose
  StartProb is set raises the "will be overwritten" warning, and a degenerate size raises the warning.
constraints:
  - "Only MathNet.Numerics (already referenced), the .NET base class library and the merged HmmLearn code: no new package."
  - "Only src/HmmLearn/BaseHmm.cs changes. Keep every signature above; every public and protected member keeps an XML summary. No abstract member may be added."
  - "Do not mutate the arrays a caller passes in; StartProb and TransMat are replaced by new arrays in the M-step and in Init."
  - "The tests are deterministic: the numbers come from the oracle through Golden.Load, compared with Close.Equal; initialization tests use fixed seeds and structural checks. Do not copy golden numbers by hand."
  - "Each test class compiles against the stubs and FAILS with NotImplementedException from them (never a compile error, never 'no test matches'): run each verify command before you finish."
  - "A case the criteria leave open is a minor ambiguity: choose the most reasonable reading, note it in an assumption and ask a non-blocking question."
  - "Run the verify commands exactly as written (dotnet run ...): they print each failing test with its message and stack. `dotnet test` cannot work in your sandbox (named pipes are blocked): do not spend time on it."
  - "Numbers come from the oracle, not from your head. Hand-written cases are for exceptions, shapes, null and in-place behaviour, invariants (a row sums to 1, a result is symmetric) and at most three exact numeric assertions on trivial inputs (zeros, ones, powers of two, an identity). Never assert exact equality to 0 or to -infinity for a result that rounding could change (a matrix that is only mathematically singular, a difference of nearly equal numbers). A wrong expectation in a locked test costs a whole round."
  - "An expected value that a test computes from a formula takes every operand from the test's own inputs by code (Math.Max(a, b), values.Sum(), a loop), never retyped by hand: the wrong one of two retyped numbers is the usual way a locked test turns out wrong (HMM-4: the maximum of (-1000, -999) written as -1000)."
  - "The report .factory/out/tests.json has exactly these fields and no other: version, ticket, role, round, status, summary, files, coverage (items: criterion C<n> and tests), assumptions (items: text and tests), questions (items: id Q<n>, question, blocking, and optionally context, options, recommendation, restates). An invented field (id, verify, description, recommended, test_disputes...) makes the validator refuse the report and costs a whole attempt."
  - "Keep your reasoning short: one reply that runs out of tokens (max-tokens) loses the whole attempt (HMM-6: 25 minutes of reasoning about the last digit of a formatted number, then nothing written). If a locked test still fails after two fixes and you cannot explain it, stop and write .factory/out/coder.json with status blocked and a question that gives the test, the expected and the actual value: the pilot answers. Never re-derive floating-point or library behaviour from bits: run a one-line experiment with the other API instead (F8 against a custom format string, Math.Round...). Custom numeric format strings round a 15-digit expansion, F8 and G17 are exact."
  - "In xunit, the string first argument of Assert.Throws<ArgumentException>(string, Action) is the expected ParamName, not a label: use Assert.Throws<T>(Action) (exact type) and put diagnostics elsewhere."
  - "A locked test that seems wrong is reported ONLY in test_disputes (exact test name, your argument, the fix you propose); never invent remark ids in replies, which answers the review remarks only (none in round 1)."
  - "Work inside this worktree only: do not read the factory or anything outside the repository."
criteria:
  - id: C1
    text: |
      Check accepts valid StartProb and TransMat and throws ArgumentException when StartProb is null, has the wrong length or does not
      sum to 1, and when TransMat is null, has the wrong shape or a row that does not sum to 1; Score on a model with invalid parameters
      fails the same way.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm9.CheckTests'
  - id: C2
    text: |
      Fit with explicit initial parameters reproduces startprob, transmat, history, n_iter_done, converged, score, aic and bic of every
      fit case of oracle/golden/base.json with both implementations (priors, the s, t and st parameter sets, structural zeros of a
      left-to-right model, sequences of length 1, a single iteration).
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm9.FitParityTests'
  - id: C3
    text: |
      Init draws valid random distributions only for the parameters that must be initialized, reproducibly for a given RandomState,
      leaves explicit parameters alone when InitParams does not name them, and raises the two warnings (parameter set although
      InitParams names it; fewer data values than free parameters).
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm9.InitTests'
  - id: C4
    text: |
      GetStationaryDistribution reproduces every case of oracle/golden/stationary.json (it sums to 1 and is invariant under TransMat) and
      throws InvalidOperationException when TransMat is null; Aic and Bic equal -2 * Score + 2 * k and -2 * Score + k * ln(rows) with k the
      sum of GetNFitScalarsPerParam(), and match the aic and bic of the fit cases.
    verify: 'dotnet run --project tests/HmmLearn.Tests -- --filter-class HmmLearn.Tests.Acceptance.Hmm9.StationaryAndCriteriaTests'
  - id: C5
    text: "The code stays readable: short methods, no dead code, the XML summaries match the behaviour."
